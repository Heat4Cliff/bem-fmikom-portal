name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_only_root
          MARIADB_DATABASE: bem_fmikom_test
          MARIADB_USER: test
          MARIADB_PASSWORD: ci_only_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: test:ci_only_test@tcp(127.0.0.1:3306)/bem_fmikom_test?parseTime=true
      TEST_DATABASE_URL: test:ci_only_test@tcp(127.0.0.1:3306)/bem_fmikom_test?parseTime=true
      JWT_SECRET: ci_only_key_with_more_than_32_bytes_randomized
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          cache: true
          require-lockfile: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: apps/api/go.sum
      - name: Audit frontend dependencies
        run: pnpm audit
      - name: Check reachable Go vulnerabilities
        run: go -C apps/api run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Check high-severity Go security issues
        run: go -C apps/api run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -severity high -confidence high ./...
      - run: pnpm verify
