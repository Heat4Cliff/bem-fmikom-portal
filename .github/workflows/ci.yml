name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          cache: true
          require-lockfile: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: apps/api/go.sum
      - run: pnpm verify
